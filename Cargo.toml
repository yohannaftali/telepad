[workspace]
resolver = "3"
members = ["crates/telepad-core", "crates/telepad-app", "crates/telepad-gui", "crates/telepad-check"]
default-members = ["crates/telepad-gui", "crates/telepad-check"]

[workspace.package]
version = "0.9.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yohannaftali/telepad"

[workspace.dependencies]
telepad-core = { path = "crates/telepad-core" }
telepad-app = { path = "crates/telepad-app" }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard", "wayland", "x11"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
arboard = { version = "3.7.0", default-features = false }
rfd = "0.18.0"
regex = { version = "1.13.2", default-features = false, features = ["std", "perf", "unicode"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
self-replace = "1.5.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = "3.5.2"
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

# Key generation / conversion in tests (#101) is slow unoptimised.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.bcrypt-pbkdf]
opt-level = 3

[profile.dev.package.blowfish]
opt-level = 3

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.p12-keystore]
opt-level = 3
