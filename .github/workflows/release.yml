name: Release

# Push a tag that matches Cargo.toml's version, e.g.:
#   git tag v0.4.0 && git push origin v0.4.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches Cargo.toml version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $v" }
      - run: cargo test --locked
      - name: Build zip
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $zip = "dist/telepad-$v-windows-x86_64.zip"
          gh release create $env:GITHUB_REF_NAME $zip "$zip.sha256" --title "Telepad $v" --generate-notes
