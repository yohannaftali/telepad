name: Feature request
description: A new metric, screen or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to see or do?
      description: The problem it solves for you.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: Where would the data come from?
      description: For a new metric, the read-only command on the host that shows it (and which systems have it).
  - type: textarea
    id: notes
    attributes:
      label: Anything else
