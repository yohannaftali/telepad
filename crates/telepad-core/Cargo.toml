[package]
name = "telepad-core"
description = "Telepad core: host inventory, OpenSSH collection, parsers and self-update (no GUI)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes = "0.8"
argon2 = "0.5"
base64 = "0.22"
calamine = "0.38.0"
csv = "1.4.0"
encoding_rs = "0.8.44"
cbc = "0.1"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
hmac = "0.12"
keyring = "4.2.0"
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust"] }
miniz_oxide = "0.8.9"
p12-keystore = "0.4"
pdf-writer = "0.15.0"
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
p384 = { version = "0.13", features = ["pkcs8", "pem"] }
pgp = "0.21.1"
pkcs8 = { version = "0.10", features = ["encryption", "pem", "std"] }
postgres = "0.19.14"
rand_core = { version = "0.6", features = ["getrandom"] }
regex.workspace = true
rsa = { version = "0.9", features = ["pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rust_xlsxwriter = { version = "0.104.0", features = ["constant_memory"] }
rusqlite.workspace = true
sec1 = { version = "0.7", features = ["pem", "std"] }
self-replace.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2.workspace = true
sha2_010 = { version = "0.10", package = "sha2" }
ssh-key = { version = "0.6", features = ["std", "ed25519", "p256", "p384", "rsa", "encryption", "getrandom"] }
thiserror.workspace = true
ttf-parser = "0.25.1"
ureq.workspace = true
zeroize = "1"
zip.workspace = true

[target."cfg(windows)".dependencies]
sysinfo = { version = "0.40.4", default-features = false, features = ["component", "disk", "network", "system"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
# LibreHardwareMonitor sensors and the thermal zone probe of My Computer (#193).
wmi = { version = "0.18.4", default-features = false }
